services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: estoque_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: estoque_saas
    ports:
      # Vinculado a loopback: acesso de ferramentas locais (psql, GUI client) continua
      # funcionando via localhost, mas a porta não fica exposta na rede/interface pública
      # do host em produção (VPS). App/worker acessam via rede interna do Compose (postgres:5432).
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18+ mudou a convenção de layout de dados (pg_ctlcluster-compatible, nomes de
      # diretório por versão maior) — o mount precisa ser em /var/lib/postgresql (não mais
      # .../data como em imagens pre-18), senão o container entra em crash loop no boot
      # (descoberto rodando o boot-smoke real deste ambiente, Docker disponível — ver
      # https://github.com/docker-library/postgres/pull/1259).
      - postgres_data:/var/lib/postgresql
    # Migrações aplicadas via `make migrate` (Prisma) após o primeiro boot — não montamos
    # schemas/migrations como initdb.d para não ter duas fontes de verdade de schema
    # (schemas/migrations/*.sql é a referência RLS/SQL puro; Prisma Migrate é quem efetivamente
    # aplica o schema no banco de desenvolvimento/produção, gerado a partir do mesmo modelo).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque_app -d estoque_saas"]
      interval: 5s
      timeout: 5s
      retries: 10
    # sre finding (T9b, readiness-review-ship.md §6) — ver comentário completo no serviço `app`.
    mem_limit: 640m
    cpus: 0.5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Ver nota em `postgres.ports` acima — mesma razão (loopback only).
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    cpus: 0.2

  app:
    build:
      context: .
      dockerfile: services/app/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # DATABASE_URL (role administrativa) não é usada em runtime pela app — apenas por
      # `make migrate`, tipicamente rodado fora do container app. APP_DATABASE_URL (role
      # restrita "app_user", sem BYPASSRLS) é a conexão real da aplicação (ver .env.example,
      # security-engineer finding C-1, e libs/shared/src/db/client.ts).
      # sre finding (T9b, readiness-review-ship.md §3): Prisma's default connection pool size is
      # `num_cpus*2+1` PER CLIENT, unbounded by config — with no container CPU limit (fixed below),
      # this scaled with the HOST's core count, not a chosen budget. `connection_limit`/
      # `pool_timeout` values are SRE's (capacity/scaling-configs.yaml) — sized so `app`+`worker`
      # together stay well under postgres.max_connections (100) with headroom.
      APP_DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD:-devpassword-app-user}@postgres:5432/estoque_saas?connection_limit=10&pool_timeout=10
      PLATFORM_ADMIN_DATABASE_URL: postgresql://platform_admin_role:${PLATFORM_ADMIN_DB_PASSWORD:-devpassword-platform-admin}@postgres:5432/estoque_saas?connection_limit=5&pool_timeout=10
      REDIS_URL: redis://redis:6379
      # qa-engineer finding C-1: LocalFileStorage's default ("./.data/uploads") is relative to CWD
      # and resolves under /repo, unwritable by the non-root `app` user (EACCES on every upload).
      # Absolute path into the volume below, which the Dockerfile chowns to `app` at image-build
      # time (so the named volume inherits that ownership on its first, empty-volume creation).
      UPLOADS_DIR: /repo/.data/uploads
    ports:
      - "3000:3000"
    volumes:
      # Shared with `worker`: this service writes the upload (POST /api/nfe-imports), the worker's
      # async parse job (BullMQ, ADR-005) reads the same file by fileRef — without a shared volume
      # each container has its own ephemeral filesystem and the worker could never see what `app`
      # wrote, EACCES or not.
      - uploads_data:/repo/.data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    # sre finding (T9b, readiness-review-ship.md §6): no container resource limits existed
    # anywhere — values from capacity/scaling-configs.yaml, sized for a 4 vCPU / 8GB VPS tier
    # (starting points, re-derive once the actual VPS spec is confirmed).
    # RE-DERIVADO (2026-09-26): VPS de produção real é o plano DigitalOcean de $12/mes
    # (1 vCPU / 2GB RAM, NYC1) — escolhido de propósito para validar antes de migrar para um
    # plano maior. Limites abaixo redimensionados para caber nesse tier (soma de mem_limit fica
    # perto do teto de 2GB de propósito, com margem para o SO — ver scripts/setup-swap.sh /
    # recomendação de swap em docs/architecture/production-deployment.md).
    mem_limit: 512m
    cpus: 0.6

  worker:
    build:
      context: .
      dockerfile: services/app/Dockerfile
    command: ["npm", "run", "worker", "--workspace", "services/app"]
    restart: unless-stopped
    env_file: .env
    environment:
      # Mesma role restrita "app_user" usada pelo processo web — ver comentário no serviço `app`.
      APP_DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD:-devpassword-app-user}@postgres:5432/estoque_saas?connection_limit=10&pool_timeout=10
      REDIS_URL: redis://redis:6379
      UPLOADS_DIR: /repo/.data/uploads # ver comentário no serviço `app` — mesmo volume, mesmo path
    volumes:
      - uploads_data:/repo/.data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # sre finding (T9b, readiness-review-ship.md §2): default stop_grace_period (10s) is short
    # relative to a large NF-e import's typical parse duration — raised so the SIGTERM handler in
    # worker/index.ts has real time to drain the in-flight job before Docker sends SIGKILL. Not
    # sized to cover every outlier (BullMQ's stalled-job recovery + HI-2's retry/backoff is the
    # backstop for that), just the common case.
    stop_grace_period: 60s
    mem_limit: 320m
    cpus: 0.3
    healthcheck:
      # Worker não expõe porta HTTP (só consome filas BullMQ) — não há endpoint para curl/wget.
      # Verifica liveness pela presença do processo Node rodando o entrypoint do worker
      # (equivalente a um "is it still running" check; não confirma que os jobs estão sendo
      # processados com sucesso — isso é responsabilidade de métricas/alerting, fora do escopo
      # deste compose). pgrep é parte do busybox no node:24-alpine (image base do Dockerfile).
      test: ["CMD-SHELL", "pgrep -f 'src/worker/index.ts' > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  uploads_data:
