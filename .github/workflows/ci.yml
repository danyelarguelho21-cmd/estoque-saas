# CI skeleton (Wave A / DevOps hardening pass).
#
# Escopo desta versão: validar que o código compila, passa lint/typecheck/testes, e que a
# imagem Docker (services/app/Dockerfile) ainda builda — pega regressões cedo, antes do merge.
# NÃO inclui (fora de escopo desta passada, ver docs/architecture/deployment-notes.md):
#   - deploy automatizado (CD) para o VPS
#   - testes de integração contra Postgres/Redis reais (nenhum serviço de banco é subido aqui;
#     os testes atuais do workspace são unit-level — `--if-present` os pula graciosamente onde
#     ainda não existem)
#   - scan de segurança (SAST/dependency audit) — fica para uma passada HARDEN futura
#
# Versões de actions verificadas via WebSearch em 2026-09-21 (freshness protocol):
# actions/checkout@v7 (v7.0.1) e actions/setup-node@v7 (v7.0.0) são as major tags atuais.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções anteriores da mesma branch/PR quando um novo push chega.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node major version pinned to match ADR-003 (Node 24 Active LTS) and the Dockerfile's
  # `node:24-alpine` base image.
  NODE_VERSION: "24"
  # Valores dummy — nenhum serviço real é necessário para typecheck/lint/build/unit tests
  # nesta fase (nenhum módulo do app valida env vars obrigatoriamente no boot/build).
  DATABASE_URL: "postgresql://estoque_app:ci@localhost:5432/estoque_saas"
  REDIS_URL: "redis://localhost:6379"
  AUTH_SECRET: "ci-dummy-secret-not-for-production"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` respeita `legacy-peer-deps=true` do .npmrc na raiz (necessário: next-auth@5 beta
      # ainda não publica peerDependencies cobrindo Next.js 16 — ver ADR-003).
      - name: Install dependencies
        run: npm ci

      # Necessário antes de typecheck/build: o Prisma Client é gerado a partir de
      # libs/shared/prisma/schema.prisma e importado por libs/shared e services/app.
      # O Dockerfile faz o mesmo (RUN npm run prisma:generate antes do build) — mantido
      # consistente aqui para que o CI reflita o que a imagem realmente faz.
      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (unit/integration, all workspaces)
        run: npm run test --workspaces --if-present

      - name: Build (services/app)
        run: npm run build --workspace services/app

      - name: Docker build (regression check only — no push)
        run: docker build -f services/app/Dockerfile -t estoque-saas-app:ci .
